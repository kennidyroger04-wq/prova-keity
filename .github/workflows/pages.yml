name: Prova Keity - Validar e publicar
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "questoes.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Validar sintaxe dos scripts
        run: |
          node --check app.js
          node --check questoes.js
      - name: Validar banco completo e alternativas
        run: |
          node - <<'NODE'
          global.window = global;
          require('./questoes.js');
          const b = global.BANCO_QUESTOES;
          if (!Array.isArray(b) || b.length !== 200) throw Error('São necessárias 200 questões');
          const p = b.filter(q => q.area === 'Português').length;
          const m = b.filter(q => q.area === 'Matemática').length;
          if (p !== 100 || m !== 100) throw Error('Distribuição incorreta: '+p+' / '+m);
          for (const q of b) {
            if (q.alternativas.length !== 4 || !Number.isInteger(q.correta) || q.correta < 0 || q.correta > 3 || !q.explicacao) throw Error('Questão inválida: '+q.id);
          }
          console.log('Validação aprovada:', b.length, 'questões;', p, 'Português;', m, 'Matemática');
          NODE
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
